---
# -------------------------------------------------------------------------
# 1. Base System and Dependencies
# -------------------------------------------------------------------------
# - name: Update apt cache and upgrade system packages (Already in main role)
#   ansible.builtin.apt:
#     update_cache: yes
#     upgrade: dist

- name: Install base system packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

# -------------------------------------------------------------------------
# 5. Azure CLI and PowerShell
# -------------------------------------------------------------------------
- name: Ensure keyring and apt sources directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/apt/keyrings
    - /etc/apt/sources.list.d

- name: Download and dearmor Microsoft GPG key
  ansible.builtin.shell: |
    curl -sLS https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor --batch --yes -o /etc/apt/keyrings/microsoft.gpg
    chmod 644 /etc/apt/keyrings/microsoft.gpg
  args:
    creates: /etc/apt/keyrings/microsoft.gpg

- name: Configure Azure CLI apt sources repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/azure-cli.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://packages.microsoft.com/repos/azure-cli/
      Suites: {{ ubuntu_codename }}
      Components: main
      Architectures: amd64
      Signed-by: /etc/apt/keyrings/microsoft.gpg

- name: Install Microsoft repository configuration package for PowerShell
  ansible.builtin.apt:
    deb: "https://packages.microsoft.com/config/ubuntu/{{ ubuntu_version }}/packages-microsoft-prod.deb"
    state: present

# -------------------------------------------------------------------------
# 6. Terraform and HashiCorp Repository
# -------------------------------------------------------------------------
- name: Download and dearmor HashiCorp GPG key
  ansible.builtin.shell: |
    wget -O- https://apt.releases.hashicorp.com/gpg | gpg --dearmor --batch --yes -o /etc/apt/keyrings/hashicorp-archive-keyring.gpg
    chmod 644 /etc/apt/keyrings/hashicorp-archive-keyring.gpg
  args:
    creates: /etc/apt/keyrings/hashicorp-archive-keyring.gpg

- name: Configure HashiCorp apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/hashicorp.list
    mode: "0644"
    content: "deb [signed-by=/etc/apt/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ubuntu_codename }} main\n"

# -------------------------------------------------------------------------
# 7. Install Azure CLI, PowerShell, Terraform & Ansible-core
# -------------------------------------------------------------------------
- name: Install Azure CLI, PowerShell, Terraform and Ansible-core
  ansible.builtin.apt:
    name:
      - azure-cli
      - powershell
      - terraform
      - ansible-core
    state: present
    update_cache: yes

# -------------------------------------------------------------------------
# 8. PowerShell Modules
# -------------------------------------------------------------------------
- name: Set PSGallery repository policy to Trusted
  ansible.builtin.command: pwsh -c 'Set-PSRepository -Name PSGallery -InstallationPolicy Trusted'
  changed_when: false

- name: Install Az PowerShell module
  ansible.builtin.command: pwsh -c 'Install-Module Az -Scope AllUsers -Force'

- name: Download and install Docker CLI binary
  ansible.builtin.unarchive:
    src: "https://download.docker.com/linux/static/stable/x86_64/docker-{{ docker_version }}.tgz"
    dest: /usr/local/bin/
    remote_src: true
    include:
      - docker/docker
    extra_opts:
      - --strip-components=1
    owner: root
    group: root
    mode: "0755"
    creates: /usr/local/bin/docker
  become: true

# -------------------------------------------------------------------------
# 9. Firewall (ufw) - keep last so provisioning is not blocked
# -------------------------------------------------------------------------
# Rule order matters: gateway allows must precede the LAN deny.
# - name: Install ufw
#   ansible.builtin.apt:
#     name: ufw
#     state: present

- name: Allow outbound DNS and DHCP to gateway
  community.general.ufw:
    rule: allow
    direction: out
    proto: "{{ item.proto }}"
    to_ip: "{{ fw_gateway }}"
    to_port: "{{ item.port }}"
  loop:
    - { proto: udp, port: "53" }
    - { proto: tcp, port: "53" }
    - { proto: udp, port: "67" }

- name: Allow inbound DHCP replies from gateway
  community.general.ufw:
    rule: allow
    direction: in
    proto: udp
    from_ip: "{{ fw_gateway }}"
    to_port: "68"

- name: Allow inbound SSH from admin subnet
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    from_ip: "{{ fw_ssh_allow_from }}"
    to_port: "22"

- name: Deny all other outbound traffic to LAN
  community.general.ufw:
    rule: deny
    direction: out
    to_ip: "{{ fw_lan_cidr }}"

- name: Set default policy deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set default policy allow outgoing (internet)
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Download and dearmor Docker APT repository GPG key
  ansible.builtin.shell: |
    curl -fsSL "https://download.docker.com/linux/ubuntu/gpg" \
      | gpg --dearmor --yes -o /etc/apt/keyrings/docker-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/docker-apt-keyring.gpg

# Kubernetes >= v1.36 requires containerd 2.x; Ubuntu 24.04 ships 1.7.
- name: Add Docker APT repository (containerd.io)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [signed-by=/etc/apt/keyrings/docker-apt-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable
    owner: root
    group: root
    mode: "0644"

- name: Check if buildx builder exists
  ansible.builtin.command: docker buildx inspect multiarch
  register: buildx_builder
  changed_when: false
  failed_when: false

- name: Create multiarch buildx builder
  ansible.builtin.command: >
    docker buildx create --name multiarch
    --driver docker-container --bootstrap --use
  when: buildx_builder.rc != 0

- name: Select multiarch builder
  ansible.builtin.command: docker buildx use multiarch
  changed_when: false

- name: Inspect builder (bootstrap)
  ansible.builtin.command: docker buildx inspect --bootstrap
  changed_when: false

- name: Inspect buildkit image manifest
  ansible.builtin.command: docker buildx imagetools inspect moby/buildkit:buildx-stable-1
  changed_when: false
