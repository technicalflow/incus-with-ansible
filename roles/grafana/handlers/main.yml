---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted

- name: Restart Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted

- name: Restart Loki
  ansible.builtin.systemd:
    name: loki
    state: restarted

- name: Restart Alloy
  ansible.builtin.systemd:
    name: alloy
    state: restarted

- name: Restart Tempo
  ansible.builtin.systemd:
    name: tempo
    state: restarted