---
- name: Prepare the system for Incus installation and install Incus
  hosts: localhost
  gather_facts: true
  become: true
  tasks:
    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Check whether macvlan profile exists
      ansible.builtin.command: incus profile show macvlan
      register: incus_profile_check
      failed_when: false
      changed_when: false
      when: "'incus' in ansible_facts.packages"

    # Done = package installed and preseed applied (macvlan profile exists).
    - name: Determine whether Incus is already installed and configured
      ansible.builtin.set_fact:
        incus_done: "{{ 'incus' in ansible_facts.packages and (incus_profile_check.rc | default(1)) == 0 }}"

    - name: Install and configure Incus
      when: not incus_done
      block:
        - name: Ensure /etc/apt/keyrings directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            owner: root
            group: root
            mode: "0755"
          when: ansible_distribution == "Debian"

        - name: Download Incus official GPG key
          ansible.builtin.get_url:
            url: https://pkgs.zabbly.com/key.asc
            dest: /etc/apt/keyrings/zabbly.asc
            owner: root
            group: root
            mode: "0644"
            force: false
          when: ansible_distribution == "Debian"

        - name: Configure Incus official APT repository
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/zabbly.asc] https://pkgs.zabbly.com/incus/lts-7.0 {{ ansible_distribution_release }} main"
            filename: zabbly
            state: present
          when: ansible_distribution == "Debian"

        - name: Ensure Incus is installed
          ansible.builtin.apt:
            name:
              - incus
              - incus-client
              - lxcfs
              - criu
              - uidmap
            state: present
            update_cache: yes
          when: ansible_distribution == "Debian"

        - name: Enable Incus COPR
          community.general.copr:
            name: neil/incus
            chroot: "epel-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}"
            state: enabled
          when: ansible_distribution == "RedHat"

        - name: Install Incus
          ansible.builtin.dnf:
            name: [incus, incus-tools]
            state: present
          when: ansible_os_family == "RedHat"

        - name: Set subuid/subgid ranges for root
          ansible.builtin.lineinfile:
            path: "{{ item }}"
            regexp: '^root:'
            line: "root:1000000:1000000000"
            create: true
            mode: "0644"
          loop: [/etc/subuid, /etc/subgid]
          when: ansible_distribution == "RedHat"

        - name: Open Incus API port
          ansible.posix.firewalld:
            port: 8443/tcp
            permanent: true
            immediate: true
            state: enabled
          when: ansible_distribution == "RedHat"

        - name: Put incusbr0 in trusted zone
          ansible.posix.firewalld:
            zone: trusted
            interface: incusbr0
            permanent: true
            immediate: true
            state: enabled
          when: ansible_os_family == "RedHat"

        - name: Enable and start Incus
          ansible.builtin.systemd:
            name: incus
            enabled: true
            state: started

        - name: Wait for the Incus daemon
          ansible.builtin.command: incus admin waitready
          changed_when: false

        - name: Initialize Incus with the predefined configuration
          ansible.builtin.command:
            cmd: incus admin init --preseed
            stdin: |
              config:
                core.https_address: "{{ ansible_default_ipv4.address }}:8443"
              storage_pools:
                - name: default
                  driver: dir
              networks:
                - name: incusbr0
                  type: bridge
                  config:
                    ipv4.address: "172.30.20.1/24"
                    ipv4.nat: "true"
                    ipv6.address: "fd40:cafe::1/64"
                    ipv6.nat: "true"
              profiles:
                - config: {}
                  name: default
                  description: Default profile
                  devices:
                    eth0:
                      name: eth0
                      network: incusbr0
                      type: nic
                    root:
                      path: /
                      pool: default
                      type: disk
                - config:
                    limits.cpu: "2"
                    limits.memory: 4GB
                  #  limits.memory.enforce: soft
                    limits.memory.swap: "false"
                  description: Macvlan profile
                  devices:
                    eth0:
                      name: eth0
                      nictype: bridged
                      parent: br0
                      type: nic
                    root:
                      path: /
                      pool: default
                      type: disk
                  name: macvlan
              cluster:
                server_name: "{{ inventory_hostname }}"
                enabled: false
          changed_when: true

        - name: Add admin user to Incus groups
          ansible.builtin.user:
            name: "{{ admin_user }}"
            groups: incus,incus-admin
            append: true
          when: admin_user is defined

