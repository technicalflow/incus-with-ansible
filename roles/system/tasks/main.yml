---
- name: Check if incus service is installed
  ansible.builtin.command: dpkg-query -W -f='${db:Status-Status}' incus
  register: incus_check
  failed_when: false
  changed_when: false

- name: Ensure Incus is installed
  ansible.builtin.apt:
    name:
      - incus
      - incus-extra
    state: present
    update_cache: yes
  when: incus_check.stdout | trim != 'installed'

- name: Wait for the Incus daemon
  ansible.builtin.command: incus admin waitready
  changed_when: false

- name: Check whether Incus is initialized
  ansible.builtin.command:
    cmd: incus profile list --format json
  register: incus_initialization_check
  failed_when: false
  changed_when: false

- name: Initialize Incus with the predefined configuration
  ansible.builtin.command:
    cmd: incus admin init --preseed
    stdin: |
      config:
        core.https_address: "{{ ansible_default_ipv4.address }}:8443"
      storage_pools:
        - name: default
          driver: dir
      networks:
        - name: incusbr0
          type: bridge
          config:
            ipv4.address: "172.30.20.1/24"
            ipv4.nat: "true"
            ipv6.address: "fd40:cafe::1/64"
            ipv6.nat: "true"
      profiles:
        - config: {}
          name: default
          description: Default profile
          devices:
            eth0:
              name: eth0
              network: incusbr0
              type: nic
            root:
              path: /
              pool: default
              type: disk
        - config:
            limits.cpu: "2"
            limits.memory: 4GB
            limits.memory.enforce: soft
            limits.memory.swap: "false"
          description: Macvlan profile
          devices:
            eth0:
              name: eth0
              nictype: bridged
              parent: eth0
              type: nic
            root:
              path: /
              pool: default
              type: disk
          name: macvlan
      cluster:
        server_name: "{{ inventory_hostname }}"
        enabled: {{ "false" | bool | lower }}
  when: incus_initialization_check.rc != 0
  changed_when: true

- name: Add admin user to Incus groups
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: incus,incus-admin
    append: true
