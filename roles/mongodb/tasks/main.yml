---
# -------------------------------------------------------------------------
# 1. Prerequisites & Repository Configuration
# -------------------------------------------------------------------------
- name: Install prerequisite packages
  ansible.builtin.apt:
    name: "{{ mongodb_prereq_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download and dearmor MongoDB GPG key
  ansible.builtin.shell:
    cmd: "curl -fsSL {{ mongodb_gpg_key_url }} | gpg --dearmor --batch --yes -o {{ mongodb_gpg_key_path }} && chmod 644 {{ mongodb_gpg_key_path }}"
  args:
    creates: "{{ mongodb_gpg_key_path }}"

- name: Add MongoDB APT repository
  ansible.builtin.copy:
    dest: "{{ mongodb_repo_file }}"
    content: "deb [ arch=amd64 signed-by={{ mongodb_gpg_key_path }} ] https://repo.mongodb.org/apt/ubuntu {{ distrib_codename }}/mongodb-org/{{ mongodb_version }} multiverse\n"
    owner: root
    group: root
    mode: "0644"

# -------------------------------------------------------------------------
# 2. Package Installation
# -------------------------------------------------------------------------
- name: Update apt cache and install MongoDB packages
  ansible.builtin.apt:
    name: "{{ mongodb_packages }}"
    state: present
    update_cache: yes

- name: Set permissions and ownership on MongoDB data directory
  ansible.builtin.file:
    path: /var/lib/mongodb
    owner: mongodb
    group: mongodb
    mode: '0755'
    recurse: yes
    state: directory

- name: Ensure MongoDB is running for administrator bootstrap
  ansible.builtin.systemd:
    name: mongod
    state: started

- name: Require a MongoDB administrator password
  ansible.builtin.assert:
    that:
      - mongodb_admin_password | length > 0
    fail_msg: >-
      Set mongodb_admin_password with Ansible Vault or an extra variable before
      running the MongoDB role.

- name: Check whether MongoDB authorization is already enabled
  ansible.builtin.shell:
    cmd: "grep -Eq '^\\s*authorization:\\s*enabled\\s*$' /etc/mongod.conf"
  register: mongodb_authorization_check
  changed_when: false
  failed_when: false

- name: Create MongoDB administrator
  ansible.builtin.shell:
    cmd: |
      mongosh --quiet --host 127.0.0.1 {% if mongodb_authorization_check.rc == 0 %}--username "$MONGODB_ADMIN_USER" --password "$MONGODB_ADMIN_PASSWORD" --authenticationDatabase admin {% endif %}admin
  args:
    stdin: |
      const username = process.env.MONGODB_ADMIN_USER;
      const password = process.env.MONGODB_ADMIN_PASSWORD;
      if (!db.getUser(username)) {
        db.createUser({user: username, pwd: password, roles: [{role: "root", db: "admin"}]});
        print("created");
      }
  environment:
    MONGODB_ADMIN_USER: "{{ mongodb_admin_user }}"
    MONGODB_ADMIN_PASSWORD: "{{ mongodb_admin_password }}"
  register: mongodb_admin_result
  changed_when: "'created' in mongodb_admin_result.stdout"
  no_log: true

- name: Enable MongoDB authorization
  ansible.builtin.blockinfile:
    path: /etc/mongod.conf
    marker: "# {mark} ANSIBLE MANAGED MONGODB AUTHORIZATION"
    block: |
      security:
        authorization: enabled
  notify: Restart MongoDB

- name: Configure MongoDB to listen on all interfaces
  ansible.builtin.lineinfile:
    path: /etc/mongod.conf
    regexp: '^(\s*bindIp:\s*)127\.0\.0\.1\s*$'
    line: '\g<1>0.0.0.0'
    backrefs: yes
  notify: Restart MongoDB

# -------------------------------------------------------------------------
# 3. Service Management
# -------------------------------------------------------------------------
- name: Ensure MongoDB service is enabled and started
  ansible.builtin.systemd:
    name: mongod
    enabled: yes
    state: started
