---
    # ---------------------------------------------------------
    # System Dependencies & Prometheus
    # ---------------------------------------------------------
    - name: Install system dependencies and Prometheus
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - unzip
          - tar
          - prometheus
        state: present
        update_cache: true
        cache_valid_time: 3600

    # ---------------------------------------------------------
    # 1. Grafana Installation & Datasources
    # ---------------------------------------------------------
    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Grafana APT GPG key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Add Grafana APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        state: present
        filename: grafana

    - name: Install Grafana package
      ansible.builtin.apt:
        name: grafana
        state: present
        update_cache: true

    - name: Configure Grafana datasources with correlated links
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/datasources.yaml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            # 1. Prometheus with Exemplars linking to Tempo
            - name: Prometheus
              type: prometheus
              uid: prometheus
              access: proxy
              url: http://localhost:9090
              isDefault: true
              editable: true
              jsonData:
                exemplarTraceIdDestinations:
                  - datasourceUid: tempo
                    name: trace_id
            # 2. Loki with Derived Fields linking to Tempo traces
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://localhost:3100
              editable: true
              jsonData:
                derivedFields:
                  - datasourceUid: tempo
                    matcherRegex: '(?:trace_id|traceId|traceID|tid)=(\w+)'
                    name: TraceID
                    url: '$${__value.raw}'
            # 3. Tempo linked to Loki logs, Prometheus metrics, and Node Graph
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://localhost:3200
              editable: true
              jsonData:
                nodeGraph:
                  enabled: true
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: '-1m'
                  spanEndTimeShift: '1m'
                  filterByTraceID: true
                tracesToMetrics:
                  datasourceUid: prometheus
                  spanStartTimeShift: '-5m'
                  spanEndTimeShift: '5m'
                serviceMap:
                  datasourceUid: prometheus
                search:
                  hide: false
      notify: Restart Grafana

    # - name: Configure Grafana datasources (inline)
    #   ansible.builtin.copy:
    #     dest: /etc/grafana/provisioning/datasources/datasources.yaml
    #     mode: "0644"
