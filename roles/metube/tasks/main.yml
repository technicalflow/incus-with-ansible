---
# - name: Require Debian or Ubuntu
#   ansible.builtin.assert:
#     that:
#       - ansible_facts['os_family'] == 'Debian'
#     fail_msg: This playbook supports Debian and Ubuntu hosts only.

- name: Install build and runtime packages
  ansible.builtin.apt:
    name:
      - aria2
      - apt-transport-https
      - build-essential
      - ca-certificates
      - curl
      - ffmpeg
      - gcc
      - git
      - gnupg
      - jq
      - python3
      - python3-dev
      - python3-pip
      - python3-venv
      - wget
    state: present
    update_cache: true

- name: Download NodeSource setup script
  ansible.builtin.get_url:
    url: "{{ metube_node_setup_url }}"
    dest: /tmp/metube-nodejs-setup.sh
    mode: '0755'

- name: Configure NodeSource repository
  ansible.builtin.command: /bin/bash /tmp/metube-nodejs-setup.sh
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js for the frontend build
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Ensure MeTube directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ metube_install_dir }}"
    - "{{ metube_download_dir }}"

- name: Check out MeTube
  ansible.builtin.git:
    repo: "{{ metube_repository }}"
    dest: "{{ metube_install_dir }}"
    version: HEAD
    update: true
    force: true
  register: metube_checkout

- name: Install frontend dependencies and build UI
  ansible.builtin.shell: |
    npm install
    npm audit fix --force
    npm run build
  args:
    chdir: "{{ metube_install_dir }}/ui"
  when: metube_checkout.changed

- name: Create MeTube Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv "{{ metube_install_dir }}/.venv"
    creates: "{{ metube_install_dir }}/.venv/bin/python3"

- name: Install uv in the MeTube virtual environment
  ansible.builtin.command:
    cmd: "{{ metube_install_dir }}/.venv/bin/pip install uv"

- name: Synchronize MeTube Python dependencies
  ansible.builtin.command:
    cmd: "{{ metube_install_dir }}/.venv/bin/uv sync"
    chdir: "{{ metube_install_dir }}"
  when: metube_checkout.changed

- name: Install MeTube systemd service
  ansible.builtin.copy:
    dest: "/etc/systemd/system/metube.service"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=MeTube Downloader
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory={{ metube_install_dir }}
      Environment="DOWNLOAD_DIR={{ metube_download_dir }}"
      Environment="OUTPUT_TEMPLATE=%(title)s.%(ext)s"
      ExecStart={{ metube_install_dir }}/.venv/bin/python3 app/main.py
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd

- name: Remove temporary Node.js build packages
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: absent
    autoremove: true

- name: Ensure MeTube is enabled and running
  ansible.builtin.systemd:
    name: "metube"
    enabled: true
    state: started
    # daemon_reload: true